[package]
name = "imc-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "imc-proxyd"
path = "src/bin/imc_proxyd.rs"

[dependencies]
imc-proxy-types = { path = "../imc-proxy-types" }
imc-proxy-copilot = { path = "../imc-proxy-copilot" }
imc-core = { path = "../imc-core" }
imc-search = { path = "../imc-search" }
imc-embed = { path = "../imc-embed" }
imc-memory = { path = "../imc-memory" }
imc-support = { path = "../imc-support" }
anyhow.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
async-stream = "0.3"
eventsource-stream = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }
regex = "1"
dirs.workspace = true
rusqlite = "0.32"
