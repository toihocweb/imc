[workspace]
resolver = "2"
members = [
    "crates/imc-core",
    "crates/imc-parser",
    "crates/imc-embed",
    "crates/imc-memory",
    "crates/imc-index",
    "crates/imc-support",
    "crates/imc-trace",
    "crates/imc-find",
    "crates/imc-cli-extra",
    "crates/imc-search",
    "crates/imc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
ignore = "0.4"
walkdir = "2"
rayon = "1"
md-5 = "0.10"
ureq = { version = "3", features = ["json"] }
dirs = "5"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1