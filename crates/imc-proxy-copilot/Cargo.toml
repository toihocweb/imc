[package]
name = "imc-proxy-copilot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
imc-proxy-types = { path = "../imc-proxy-types" }
imc-core = { path = "../imc-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-stream = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Same version/features the sibling crates already resolve in Cargo.lock, so
# adding them here pulls no new packages into the workspace.
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }